services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gestion_ropa
      DB_USERNAME: gestion
      DB_PASSWORD: gestion
      SEED_DATABASE: "true"
    volumes:
      - .:/app
      - /app/vendor
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gestion_ropa
      MYSQL_USER: gestion
      MYSQL_PASSWORD: gestion
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
